<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de Siniestros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos extra para asegurar que el texto sea fácil de seleccionar */
    .copy-block { white-space: pre-wrap; font-family: monospace; user-select: all; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900 font-sans">

  <!-- Navegación -->
  <nav class="bg-black text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wider">AUDITORÍA WMS</h1>
      <div class="flex gap-4">
        <button onclick="switchTab('scanner')" id="tab-scanner" class="px-4 py-2 bg-white text-black font-semibold rounded-md transition border-2 border-white">
          Escáner y Desglose
        </button>
        <button onclick="switchTab('templates')" id="tab-templates" class="px-4 py-2 text-white font-semibold rounded-md transition border-2 border-transparent hover:border-gray-500">
          Templates
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 mt-6">
    
    <!-- PESTAÑA 1: ESCÁNER -->
    <div id="view-scanner" class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 block">
      <div class="mb-6">
        <h2 class="text-2xl font-bold mb-2">Desglose de Unidad (HU/MU)</h2>
        <p class="text-gray-500 text-sm">Escanea un código MU. El sistema agrupará todos los MU asociados a su misma tarima (HU) y expandirá las cantidades.</p>
      </div>

      <div class="flex gap-4 mb-8">
        <input type="text" id="scanInput" placeholder="Escanea o escribe el MU (Ej. MU-TT-RC-...)" 
          class="flex-1 border-2 border-gray-300 p-3 rounded-md focus:outline-none focus:border-black font-mono text-lg">
        <button onclick="buscarDatos()" class="bg-black hover:bg-gray-800 text-white font-bold px-8 py-3 rounded-md transition">
          Buscar
        </button>
      </div>

      <div id="statusMsg" class="hidden text-center py-4 font-semibold text-gray-600 mb-4 bg-gray-50 rounded"></div>

      <!-- Contenedor de Resultados (Columnas) -->
      <div id="resultados" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Los datos se inyectarán aquí -->
      </div>
    </div>

    <!-- PESTAÑA 2: TEMPLATES -->
    <div id="view-templates" class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 hidden">
      <h2 class="text-2xl font-bold mb-6">Templates de Siniestros</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Template 1 -->
        <div class="flex flex-col">
          <label class="font-bold mb-2 border-b border-gray-300 pb-2">HU por TS</label>
          <textarea class="w-full h-64 p-3 border border-gray-300 rounded focus:outline-none focus:border-black font-mono text-sm resize-none" placeholder="Pega aquí los datos..."></textarea>
          <button class="mt-2 bg-gray-200 hover:bg-gray-300 text-black py-2 rounded text-sm font-semibold transition" onclick="copiarTexto(this)">Copiar Template</button>
        </div>

        <!-- Template 2 -->
        <div class="flex flex-col">
          <label class="font-bold mb-2 border-b border-gray-300 pb-2">MU por TS</label>
          <textarea class="w-full h-64 p-3 border border-gray-300 rounded focus:outline-none focus:border-black font-mono text-sm resize-none" placeholder="Pega aquí los datos..."></textarea>
          <button class="mt-2 bg-gray-200 hover:bg-gray-300 text-black py-2 rounded text-sm font-semibold transition" onclick="copiarTexto(this)">Copiar Template</button>
        </div>

        <!-- Template 3 -->
        <div class="flex flex-col">
          <label class="font-bold mb-2 border-b border-gray-300 pb-2">MU y MELI</label>
          <textarea class="w-full h-64 p-3 border border-gray-300 rounded focus:outline-none focus:border-black font-mono text-sm resize-none" placeholder="Pega aquí los datos..."></textarea>
          <button class="mt-2 bg-gray-200 hover:bg-gray-300 text-black py-2 rounded text-sm font-semibold transition" onclick="copiarTexto(this)">Copiar Template</button>
        </div>

      </div>
    </div>

  </main>

  <script>
    let rawData = [];

    // Cargar datos al iniciar la página
    window.onload = async () => {
      const statusMsg = document.getElementById('statusMsg');
      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        const n8nData = await response.json();
        
        // CORRECCIÓN CLAVE: Desempaquetar el formato de n8n (sacar los datos de la propiedad "json")
        rawData = n8nData.map(item => item.json ? item.json : item);
        
      } catch (error) {
        statusMsg.textContent = "⚠️ Error cargando data.json. Asegúrate de que el flujo de n8n ya se ejecutó con éxito.";
        statusMsg.classList.remove('hidden');
      }
    };

    function switchTab(tab) {
      document.getElementById('view-scanner').classList.toggle('hidden', tab !== 'scanner');
      document.getElementById('view-templates').classList.toggle('hidden', tab !== 'templates');
      
      const tabScanner = document.getElementById('tab-scanner');
      const tabTemplates = document.getElementById('tab-templates');

      if(tab === 'scanner') {
        tabScanner.className = "px-4 py-2 bg-white text-black font-semibold rounded-md transition border-2 border-white";
        tabTemplates.className = "px-4 py-2 text-white font-semibold rounded-md transition border-2 border-transparent hover:border-gray-500";
      } else {
        tabTemplates.className = "px-4 py-2 bg-white text-black font-semibold rounded-md transition border-2 border-white";
        tabScanner.className = "px-4 py-2 text-white font-semibold rounded-md transition border-2 border-transparent hover:border-gray-500";
      }
    }

    function buscarDatos() {
      const inputVal = document.getElementById('scanInput').value.trim().toUpperCase();
      const statusMsg = document.getElementById('statusMsg');
      const contenedor = document.getElementById('resultados');
      
      contenedor.innerHTML = '';
      statusMsg.classList.add('hidden');

      if (!inputVal) return;

      if (rawData.length === 0) {
        statusMsg.textContent = "La base de datos está vacía o aún no se carga. Intenta en unos segundos.";
        statusMsg.classList.remove('hidden');
        return;
      }

      // 1. Buscar si el input coincide con algún MU o HU
      const targetRecord = rawData.find(row => 
        (row.MU && String(row.MU).toUpperCase() === inputVal) || 
        (row.HU_ID && String(row.HU_ID).toUpperCase() === inputVal)
      );

      if (!targetRecord) {
        statusMsg.textContent = "No se encontraron registros para este código en los últimos 5 días.";
        statusMsg.classList.remove('hidden');
        return;
      }

      const targetHU = targetRecord.HU_ID;
      const targetIS = targetRecord.IS_ID || 'N/A';
      const targetLlave = targetRecord.LLAVE_MAESTRA || 'N/A';

      // 2. Filtrar toda la carga que pertenece a ese HU
      const cargaCompleta = rawData.filter(row => row.HU_ID === targetHU);

      // 3. Agrupar por MU
      const agrupadoPorMU = {};
      cargaCompleta.forEach(row => {
        const mu = row.MU || 'SIN-MU';
        if (!agrupadoPorMU[mu]) {
          agrupadoPorMU[mu] = [];
        }
        
        // Multiplicar MELIs por la cantidad (Expansión para copy-paste)
        const cantidad = parseInt(row.CANTIDAD) || 1;
        for (let i = 0; i < cantidad; i++) {
          agrupadoPorMU[mu].push(row.MELI);
        }
      });

      // 4. Renderizar las columnas
      for (const [mu, melis] of Object.entries(agrupadoPorMU)) {
        const muBlock = document.createElement('div');
        muBlock.className = "bg-gray-50 border border-gray-300 rounded-md p-4 flex flex-col shadow-sm";
        
        const listaMelis = melis.join('\n');

        muBlock.innerHTML = `
          <div class="flex flex-col border-b border-gray-300 pb-2 mb-3 gap-1 text-xs">
            <div class="flex justify-between">
              <span class="font-bold text-gray-500">TS (Llave):</span>
              <span class="font-mono">${targetLlave}</span>
            </div>
            <div class="flex justify-between">
              <span class="font-bold text-gray-500">IS_ID:</span>
              <span class="font-mono">${targetIS}</span>
            </div>
            <div class="flex justify-between items-center mt-1">
              <span class="font-bold text-gray-500">HU_ID:</span>
              <span class="bg-black text-white px-2 py-0.5 rounded font-mono">${targetHU}</span>
            </div>
          </div>
          
          <span class="font-bold text-sm mb-1 text-black">MU</span>
          <div class="copy-block font-bold text-black mb-4 bg-gray-200 p-2 rounded cursor-pointer hover:bg-gray-300 transition" title="Haz clic para seleccionar todo">${mu}</div>
          
          <span class="font-bold text-sm mb-1 text-black">MELIs expandidos (Total: ${melis.length})</span>
          <div class="copy-block flex-1 bg-white border border-gray-200 p-2 rounded text-sm text-gray-700 h-48 overflow-y-auto cursor-pointer hover:border-gray-400 transition" title="Haz clic para seleccionar todo">${listaMelis}</div>
        `;
        contenedor.appendChild(muBlock);
      }
    }

    function copiarTexto(btn) {
      const textarea = btn.previousElementSibling;
      textarea.select();
      document.execCommand('copy');
      
      const originalText = btn.innerText;
      btn.innerText = "¡Copiado!";
      btn.classList.replace('bg-gray-200', 'bg-black');
      btn.classList.replace('text-black', 'text-white');
      
      setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.replace('bg-black', 'bg-gray-200');
        btn.classList.replace('text-white', 'text-black');
      }, 2000);
    }
  </script>
</body>
</html>
