<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de Siniestros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Permite seleccionar todo el texto con un solo clic */
    .copy-block { white-space: pre-wrap; font-family: monospace; user-select: all; }
    /* Estilo para la barra de desplazamiento */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans">

  <!-- Navegación con Color -->
  <nav class="bg-blue-900 text-white p-4 shadow-lg border-b-4 border-yellow-400">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📦</span>
        <h1 class="text-xl font-bold tracking-wider">AUDITORÍA WMS</h1>
      </div>
      <div class="flex gap-4">
        <button onclick="switchTab('scanner')" id="tab-scanner" class="px-4 py-2 bg-yellow-400 text-blue-900 font-bold rounded-md transition shadow hover:bg-yellow-300">
          Escáner y Desglose
        </button>
        <button onclick="switchTab('templates')" id="tab-templates" class="px-4 py-2 text-white font-semibold rounded-md transition hover:bg-blue-800">
          Templates
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 mt-4">
    
    <!-- PESTAÑA 1: ESCÁNER -->
    <div id="view-scanner" class="bg-white p-8 rounded-xl shadow-md border border-slate-200 block">
      <div class="mb-6 flex justify-between items-start">
        <div>
          <h2 class="text-2xl font-extrabold text-blue-900 mb-2">Desglose por Tarima (HU)</h2>
          <p class="text-slate-500 text-sm">Escanea un código MU o HU. El sistema agrupará toda la tarima en un solo bloque.</p>
        </div>
        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Inbound Transfers</span>
      </div>

      <div class="flex gap-4 mb-8">
        <input type="text" id="scanInput" placeholder="Escanea o escribe el código (Ej. MU-TT-... o 2425...)" 
          class="flex-1 border-2 border-slate-300 p-4 rounded-lg focus:outline-none focus:border-blue-500 font-mono text-lg shadow-sm transition">
        <button onclick="buscarDatos()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-extrabold px-10 py-4 rounded-lg shadow-md transition transform hover:scale-105">
          BUSCAR
        </button>
      </div>

      <div id="statusMsg" class="hidden text-center py-4 font-semibold text-rose-600 mb-4 bg-rose-50 rounded-lg border border-rose-200"></div>

      <!-- Contenedor del Resultado Agrupado -->
      <div id="resultados" class="hidden flex-col gap-6">
        <!-- Los datos se inyectarán aquí -->
      </div>
    </div>

    <!-- PESTAÑA 2: TEMPLATES -->
    <div id="view-templates" class="bg-white p-8 rounded-xl shadow-md border border-slate-200 hidden">
      <h2 class="text-2xl font-extrabold text-blue-900 mb-6">Templates de Siniestros</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Template 1 -->
        <div class="flex flex-col bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="font-bold text-blue-900 mb-2 border-b border-slate-300 pb-2">HU por TS</label>
          <textarea class="w-full h-64 p-3 border border-slate-300 rounded focus:outline-none focus:border-blue-500 font-mono text-sm resize-none shadow-inner" placeholder="Pega aquí los datos..."></textarea>
          <button class="mt-4 bg-blue-900 hover:bg-blue-800 text-white py-2 rounded text-sm font-bold transition shadow-sm" onclick="copiarTexto(this)">Copiar Template</button>
        </div>

        <!-- Template 2 -->
        <div class="flex flex-col bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="font-bold text-blue-900 mb-2 border-b border-slate-300 pb-2">MU por TS</label>
          <textarea class="w-full h-64 p-3 border border-slate-300 rounded focus:outline-none focus:border-blue-500 font-mono text-sm resize-none shadow-inner" placeholder="Pega aquí los datos..."></textarea>
          <button class="mt-4 bg-blue-900 hover:bg-blue-800 text-white py-2 rounded text-sm font-bold transition shadow-sm" onclick="copiarTexto(this)">Copiar Template</button>
        </div>

        <!-- Template 3 -->
        <div class="flex flex-col bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="font-bold text-blue-900 mb-2 border-b border-slate-300 pb-2">MU y MELI</label>
          <textarea class="w-full h-64 p-3 border border-slate-300 rounded focus:outline-none focus:border-blue-500 font-mono text-sm resize-none shadow-inner" placeholder="Pega aquí los datos..."></textarea>
          <button class="mt-4 bg-blue-900 hover:bg-blue-800 text-white py-2 rounded text-sm font-bold transition shadow-sm" onclick="copiarTexto(this)">Copiar Template</button>
        </div>

      </div>
    </div>

  </main>

  <script>
    let rawData = [];

    // Cargar datos
    window.onload = async () => {
      const statusMsg = document.getElementById('statusMsg');
      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        const n8nData = await response.json();
        // Desempaquetar n8n
        rawData = n8nData.map(item => item.json ? item.json : item);
      } catch (error) {
        statusMsg.textContent = "⚠️ Error cargando data.json. Espera a que n8n se ejecute y recarga la página.";
        statusMsg.classList.remove('hidden');
      }
    };

    function switchTab(tab) {
      document.getElementById('view-scanner').classList.toggle('hidden', tab !== 'scanner');
      document.getElementById('view-templates').classList.toggle('hidden', tab !== 'templates');
      
      const tabScanner = document.getElementById('tab-scanner');
      const tabTemplates = document.getElementById('tab-templates');

      if(tab === 'scanner') {
        tabScanner.className = "px-4 py-2 bg-yellow-400 text-blue-900 font-bold rounded-md transition shadow hover:bg-yellow-300";
        tabTemplates.className = "px-4 py-2 text-white font-semibold rounded-md transition hover:bg-blue-800";
      } else {
        tabTemplates.className = "px-4 py-2 bg-yellow-400 text-blue-900 font-bold rounded-md transition shadow hover:bg-yellow-300";
        tabScanner.className = "px-4 py-2 text-white font-semibold rounded-md transition hover:bg-blue-800";
      }
    }

    function buscarDatos() {
      const inputVal = document.getElementById('scanInput').value.trim().toUpperCase();
      const statusMsg = document.getElementById('statusMsg');
      const contenedor = document.getElementById('resultados');
      
      contenedor.innerHTML = '';
      contenedor.classList.add('hidden');
      statusMsg.classList.add('hidden');

      if (!inputVal) return;

      if (rawData.length === 0) {
        statusMsg.textContent = "La base de datos aún no se carga. Intenta en unos segundos.";
        statusMsg.classList.remove('hidden');
        return;
      }

      // 1. Encontrar registro y extraer HU
      const targetRecord = rawData.find(row => 
        (row.MU && String(row.MU).toUpperCase() === inputVal) || 
        (row.HU_ID && String(row.HU_ID).toUpperCase() === inputVal)
      );

      if (!targetRecord) {
        statusMsg.textContent = "No se encontraron registros para este código.";
        statusMsg.classList.remove('hidden');
        return;
      }

      const targetHU = targetRecord.HU_ID || 'N/A';
      const targetIS = targetRecord.IS_ID || 'N/A';
      const targetLlave = targetRecord.LLAVE_MAESTRA || 'N/A';

      // 2. Filtrar TODA la carga de ese HU
      const cargaCompleta = rawData.filter(row => row.HU_ID === targetHU);

      // 3. Agrupar por MU y expandir MELIs
      const agrupadoPorMU = {};
      cargaCompleta.forEach(row => {
        const mu = row.MU || 'SIN-MU';
        if (!agrupadoPorMU[mu]) agrupadoPorMU[mu] = [];
        
        const cantidad = parseInt(row.CANTIDAD) || 1;
        for (let i = 0; i < cantidad; i++) {
          agrupadoPorMU[mu].push(row.MELI);
        }
      });

      // --- RENDERIZADO DEL BLOQUE AGRUPADO ---
      
      // A. Encabezado principal (IS, HU, TS)
      let htmlContent = `
        <div class="bg-blue-50 border-l-4 border-blue-600 p-6 rounded-r-lg shadow-sm">
          <h3 class="text-lg font-extrabold text-blue-900 mb-4 border-b border-blue-200 pb-2">Información General de la Tarima</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="flex flex-col">
              <span class="text-sm font-bold text-blue-800 mb-1">IS_ID</span>
              <div class="copy-block bg-white border border-blue-300 p-3 rounded font-mono text-lg text-slate-800 shadow-sm cursor-pointer hover:border-blue-500 transition" title="Clic para copiar">${targetIS}</div>
            </div>

            <div class="flex flex-col">
              <span class="text-sm font-bold text-blue-800 mb-1">HU_ID (Tarima)</span>
              <div class="copy-block bg-white border border-blue-300 p-3 rounded font-mono text-lg text-slate-800 shadow-sm cursor-pointer hover:border-blue-500 transition" title="Clic para copiar">${targetHU}</div>
            </div>

            <div class="flex flex-col">
              <span class="text-sm font-bold text-blue-800 mb-1">TS (Llave Maestra)</span>
              <div class="copy-block bg-white border border-blue-300 p-3 rounded font-mono text-lg text-slate-800 shadow-sm cursor-pointer hover:border-blue-500 transition" title="Clic para copiar">${targetLlave}</div>
            </div>

          </div>
        </div>
        
        <div class="bg-white border border-slate-300 rounded-lg shadow-sm p-6">
          <h3 class="text-lg font-extrabold text-slate-800 mb-4 border-b border-slate-200 pb-2">Desglose de Cajas (MUs) y Artículos (MELIs)</h3>
          <div class="space-y-6">
      `;

      // B. Filas de MUs con sus MELIs al lado
      for (const [mu, melis] of Object.entries(agrupadoPorMU)) {
        const listaMelis = melis.join('\n');
        
        htmlContent += `
            <div class="flex flex-col md:flex-row gap-4 bg-slate-50 p-4 rounded-md border border-slate-200">
              
              <!-- Columna MU -->
              <div class="md:w-1/3 flex flex-col">
                <span class="text-xs font-bold text-slate-500 mb-1 uppercase">Código MU</span>
                <div class="copy-block bg-white border border-slate-300 p-3 rounded font-mono text-sm text-slate-800 h-full cursor-pointer hover:border-blue-400 transition" title="Clic para copiar">${mu}</div>
              </div>

              <!-- Columna MELIs -->
              <div class="md:w-2/3 flex flex-col">
                <span class="text-xs font-bold text-slate-500 mb-1 uppercase">MELIs (${melis.length} artículos)</span>
                <div class="copy-block bg-white border border-slate-300 p-3 rounded font-mono text-sm text-slate-800 max-h-48 overflow-y-auto cursor-pointer hover:border-blue-400 transition" title="Clic para copiar">${listaMelis}</div>
              </div>

            </div>
        `;
      }

      htmlContent += `
          </div>
        </div>
      `;

      contenedor.innerHTML = htmlContent;
      contenedor.classList.remove('hidden');
    }

    function copiarTexto(btn) {
      const textarea = btn.previousElementSibling;
      textarea.select();
      document.execCommand('copy');
      
      const originalText = btn.innerText;
      btn.innerText = "¡Copiado a portapapeles!";
      btn.classList.replace('bg-blue-900', 'bg-emerald-600');
      btn.classList.replace('hover:bg-blue-800', 'hover:bg-emerald-500');
      
      setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.replace('bg-emerald-600', 'bg-blue-900');
        btn.classList.replace('hover:bg-emerald-500', 'hover:bg-blue-800');
      }, 2000);
    }
  </script>
</body>
</html>
